<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HNGVR">

<!-- PWA manifest and icons -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<title>HNGVR</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--bg2:#ffffff;--bg3:#e8edf5;--card:#ffffff;--border:#dde4f0;--accent:#E8192C;--gold:#F5C842;--navy:#0d2b5e;--text:#0d2b5e;--text2:#4a5f8a;--text3:#8899bb;--green:#16a34a;--red:#E8192C;--blue:#1565C0;--purple:#7c3aed;--fd:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--fb);background:#f4f6fb;color:#0d2b5e;min-height:100vh;overflow-x:hidden;}
#splash{position:fixed;inset:0;background:#1565C0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .5s;}
#splash.hide{opacity:0;pointer-events:none;}
.sball{font-size:4rem;margin-bottom:1.5rem;animation:bounce 1s ease infinite;}
.slogo{font-family:var(--fd);font-size:4rem;font-weight:900;letter-spacing:2px;color:#ffffff;}
.ssub{font-size:.75rem;color:rgba(255,255,255,.6);letter-spacing:4px;text-transform:uppercase;margin-top:6px;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#app{display:none;flex-direction:column;min-height:100vh;}
#app.visible{display:flex;}
.topbar{position:sticky;top:0;z-index:100;background:#1565C0;border-bottom:none;padding:0 16px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;min-height:52px;}
.tlogo{font-family:var(--fd);font-weight:900;font-size:1.5rem;letter-spacing:1px;color:#ffffff;}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#ffffff;backdrop-filter:blur(20px);border-top:1px solid #dde4f0;box-shadow:0 -2px 12px rgba(13,43,94,.08);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;border:none;background:none;transition:all .2s;}
.nb .ni{font-size:1.25rem;transition:transform .2s;}
.nb .nl{font-size:.58rem;letter-spacing:1px;text-transform:uppercase;color:#8899bb;font-weight:600;}
.nb.active .ni{transform:scale(1.15);}
.nb.active .nl{color:#1565C0;}
.main{flex:1;padding:12px 14px 88px;max-width:600px;margin:0 auto;width:100%;}
.page{display:none;}.page.active{display:block;}
.stitle{font-family:var(--fd);font-size:1.7rem;font-weight:900;letter-spacing:-.5px;margin-bottom:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;color:#0d2b5e;}
.badge{font-size:.7rem;font-weight:700;letter-spacing:2px;color:#1565C0;background:rgba(21,101,192,.1);border:1px solid rgba(21,101,192,.3);padding:2px 9px;border-radius:20px;}
.badge-r{color:#E8192C;background:rgba(232,25,44,.1);border-color:rgba(239,68,68,.3);}
.badge-gold{color:#b8860b;background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);}
.card{background:#ffffff;border:1px solid #dde4f0;border-radius:12px;padding:14px;margin-bottom:10px;}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:#e8edf5;padding:4px;border-radius:10px;}
.tab{flex:1;padding:7px 4px;text-align:center;border-radius:7px;cursor:pointer;font-family:var(--fd);font-size:.85rem;font-weight:700;color:#8899bb;transition:all .2s;border:none;background:none;}
.tab.active{background:#ffffff;color:#0d2b5e;box-shadow:0 1px 6px rgba(13,43,94,.12);}
.fscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.fscroll::-webkit-scrollbar{display:none;}
.fc{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid #dde4f0;background:#f4f6fb;color:#4a5f8a;transition:all .2s;}
.fc.active{background:#1565C0;color:#fff;border-color:#1565C0;}
.fg{margin-bottom:12px;}
.fl{font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:#8899bb;font-weight:600;margin-bottom:5px;display:block;}
.fi,.fs{width:100%;background:#f4f6fb;border:1px solid #dde4f0;border-radius:8px;padding:10px 13px;color:#0d2b5e;font-family:var(--fb);font-size:.95rem;outline:none;-webkit-appearance:none;transition:border-color .2s;}
.fi:focus,.fs:focus{border-color:#1565C0;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;border:none;cursor:pointer;font-family:var(--fd);font-size:1rem;font-weight:700;transition:all .2s;width:100%;}
.btp{background:#1565C0;color:#fff;}
.btp:active{filter:brightness(.9);transform:scale(.98);}
.btg{background:#f4f6fb;color:#4a5f8a;border:1px solid #dde4f0;}
.btg:active{transform:scale(.98);}
.bts{padding:8px 14px;font-size:.85rem;width:auto;}
.btd{background:rgba(232,25,44,.12);color:#E8192C;border:1px solid rgba(239,68,68,.3);}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:200;display:none;align-items:flex-end;}
.mo.open{display:flex;}
.md{background:#ffffff;border:1px solid #dde4f0;border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:0 18px 22px;padding-bottom:max(22px,env(safe-area-inset-bottom));animation:slideUp .3s ease;}.md-sticky-close{position:sticky;top:0;z-index:10;background:#ffffff;padding:14px 0 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eef2f8;margin-bottom:16px;}.md-close-btn{background:none;border:none;font-size:1.5rem;color:#8899bb;cursor:pointer;padding:4px;line-height:1;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:36px;height:4px;background:#dde4f0;border-radius:2px;margin:0 auto 0;}
.mt2{font-family:var(--fd);font-size:1.5rem;font-weight:900;margin-bottom:18px;}
.dv{height:1px;background:#dde4f0;margin:14px 0;}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#16a34a;color:#fff;padding:10px 20px;border-radius:20px;font-weight:600;font-size:.85rem;opacity:0;transition:all .3s;z-index:300;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:#dde4f0;border-radius:2px;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}
.ptag{font-size:.58rem;letter-spacing:1px;text-transform:uppercase;color:#8899bb;background:#e8edf5;border:1px solid #dde4f0;padding:1px 6px;border-radius:8px;margin-left:5px;}

/* ── GAME CARDS (ESPN style) ── */
.wk-strip{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;margin:0;background:#fff;border-bottom:1px solid #eef2f8;-webkit-overflow-scrolling:touch;}.wk-strip::-webkit-scrollbar{display:none;}.wk-chip{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:.75rem;font-weight:700;cursor:pointer;border:1.5px solid #dde4f0;background:#f4f6fb;color:#8899bb;font-family:var(--fd);letter-spacing:.5px;transition:all .2s;}.wk-chip.active{background:#1565C0;color:#fff;border-color:#1565C0;}.wk-chip.has-live{border-color:#E8192C;color:#E8192C;}.wk-chip.active.has-live{background:#E8192C;border-color:#E8192C;color:#fff;}
.game-section-label{font-size:.65rem;letter-spacing:2.5px;text-transform:uppercase;color:#8899bb;font-weight:700;margin:16px 0 8px;padding-left:2px;}
.game-card{background:#ffffff;border:1px solid #dde4f0;border-radius:12px;overflow:hidden;margin-bottom:10px;cursor:pointer;transition:border-color .2s;box-shadow:0 1px 4px rgba(13,43,94,.06);}
.game-card:active{border-color:#1565C0;}
.game-card.live-card{border-top:2px solid #E8192C;border-color:#E8192C;}
.game-card-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #eef2f8;background:#f8f9fd;}
.game-status-live{display:flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#E8192C;}
.live-pip{width:7px;height:7px;background:#E8192C;border-radius:50%;animation:pulse 1.2s ease infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.game-status-sched{font-size:.72rem;color:#8899bb;font-weight:600;}
.game-status-final{font-size:.72rem;color:#8899bb;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.game-card-body{display:flex;align-items:center;padding:12px 14px;gap:8px;}
.team-col{flex:1;min-width:0;}
.team-name-gc{font-family:var(--fd);font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0d2b5e;}
.team-score-gc{font-family:var(--fd);font-size:2.6rem;font-weight:900;line-height:1;color:#0d2b5e;}
.team-score-gc.winner{color:#1565C0;}
.score-sep{font-family:var(--fd);font-size:1.2rem;color:#c5d0e8;padding:0 4px;align-self:center;}
.game-time-col{text-align:center;min-width:70px;}
.game-clock{font-family:var(--fd);font-size:1.1rem;font-weight:800;color:#4a5f8a;}
.game-half{font-size:.65rem;letter-spacing:1px;text-transform:uppercase;color:#8899bb;font-weight:700;margin-top:2px;}
.game-tipoff{font-family:var(--fd);font-size:1rem;font-weight:700;color:#4a5f8a;}
.game-date{font-size:.65rem;color:#8899bb;margin-top:2px;}

/* ── GAME DETAIL / LIVE FEED ── */
.game-detail-header{background:linear-gradient(135deg,#1a0a00,#0a0a1a);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden;}
.game-detail-header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#E8192C,#1565C0,#b8860b,#1565C0,#E8192C);background-size:200%;animation:shimmer 2.5s linear infinite;}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
.gdh-scores{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.gdh-team{text-align:center;flex:1;}
.gdh-tname{font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:#4a5f8a;font-weight:600;margin-bottom:4px;}
.gdh-score{font-family:var(--fd);font-size:3.8rem;font-weight:900;line-height:1;}
.gdh-mid{text-align:center;padding:0 10px;}
.gdh-clock{font-family:var(--fd);font-size:1.3rem;font-weight:800;color:#4a5f8a;}
.gdh-half{font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;color:#8899bb;font-weight:700;margin-top:3px;}
.gdh-tabs{display:flex;gap:0;border-bottom:1px solid #eef2f8;margin-bottom:14px;}
.gdh-tab{flex:1;padding:10px 6px;text-align:center;font-family:var(--fd);font-size:.85rem;font-weight:700;color:#8899bb;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.gdh-tab.active{color:#E8192C;border-bottom-color:#E8192C;}

/* Play feed */
.play-feed{display:flex;flex-direction:column;gap:0;}
.play-entry{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.play-entry:last-child{border-bottom:none;}
.play-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:.8rem;color:#fff;flex-shrink:0;}
.play-body{flex:1;min-width:0;}
.play-action{font-weight:700;font-size:.92rem;color:#0d2b5e;}
.play-meta{font-size:.72rem;color:#8899bb;margin-top:1px;}
.play-score-snap{font-family:var(--fd);font-size:.8rem;font-weight:700;color:#4a5f8a;text-align:right;flex-shrink:0;padding-top:2px;}
.play-pts-badge{display:inline-block;font-family:var(--fd);font-size:.75rem;font-weight:800;padding:1px 7px;border-radius:10px;margin-left:6px;}
.pts-score{background:rgba(34,197,94,.15);color:#16a34a;}
.pts-def{background:rgba(59,130,246,.15);color:#1565C0;}
.pts-neutral{background:rgba(255,255,255,.08);color:#4a5f8a;}

/* Box score */
.box-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.box-table th{padding:6px 8px;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;color:#8899bb;font-weight:700;text-align:center;border-bottom:1px solid #eef2f8;}
.box-table th:first-child{text-align:left;}
.box-table td{padding:8px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04);font-family:var(--fd);font-weight:700;}
.box-table td:first-child{text-align:left;font-family:var(--fb);font-weight:600;font-size:.85rem;}
.box-table tr:last-child td{border-bottom:none;}
.box-team-header{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:#8899bb;font-weight:700;padding:10px 8px 4px;display:block;}

/* ── PLAYER CARDS ── */
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eef2f8;cursor:pointer;}
.prow:last-child{border-bottom:none;}
.rnk{font-family:var(--fd);font-size:1.1rem;font-weight:800;color:#8899bb;min-width:24px;text-align:center;}
.rnk.g{color:#b8860b;}.rnk.s{color:#cbd5e1;}.rnk.b{color:#b45309;}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:.9rem;color:#fff;flex-shrink:0;}
.pi{flex:1;min-width:0;}
.pn{font-weight:600;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pt{font-size:.68rem;color:#8899bb;}
.pv{font-family:var(--fd);font-size:1.4rem;font-weight:800;}
.plbl{font-size:.52rem;letter-spacing:1px;text-transform:uppercase;color:#8899bb;text-align:right;}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.sb{background:#f4f6fb;border-radius:8px;padding:8px 5px;text-align:center;border:1px solid #dde4f0;}
.sb .v{font-family:var(--fd);font-size:1.4rem;font-weight:800;color:#0d2b5e;line-height:1;}
.sb .l{font-size:.56rem;letter-spacing:1.5px;text-transform:uppercase;color:#8899bb;margin-top:2px;font-weight:600;}
.sb.hi{border-color:rgba(21,101,192,.4);background:rgba(21,101,192,.08);}
.sb.hi .v{color:#E8192C;}

/* ── HOF ── */
.hof-card{background:#ffffff;border:1px solid #dde4f0;border-radius:16px;padding:20px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(13,43,94,.08);}
.hof-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#1565C0,#E8192C,#1565C0);background-size:200%;animation:shimmer 3s linear infinite;}
.accolade-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.accolade{background:#f4f6fb;border:1px solid #dde4f0;border-radius:8px;padding:10px 11px;display:flex;align-items:center;gap:9px;}
.accolade-icon{font-size:1.3rem;flex-shrink:0;}
.accolade-title{font-size:.58rem;letter-spacing:1.5px;text-transform:uppercase;color:#8899bb;font-weight:600;}
.accolade-name{font-family:var(--fd);font-size:.95rem;font-weight:800;color:#0d2b5e;line-height:1.2;}
.accolade-val{font-size:.7rem;color:#1565C0;font-weight:600;margin-top:1px;}
.accolade.mvp{border-color:rgba(245,200,66,.5);background:rgba(245,200,66,.08);}
.accolade.mvp .accolade-name{color:#b8860b;}
.accolade.fmvp{border-color:rgba(21,101,192,.3);background:rgba(21,101,192,.06);}
.accolade.fmvp .accolade-name{color:#1565C0;}
.atr-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef2f8;}
.atr-row:last-child{border-bottom:none;}

/* ── PIN GATE ── */
.pin-gate{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;}
.pin-display{font-family:var(--fd);font-size:3rem;font-weight:900;letter-spacing:16px;color:#0d2b5e;margin:20px 0;min-height:60px;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;width:100%;}
.pin-btn{background:#f4f6fb;border:1px solid #dde4f0;border-radius:12px;padding:18px;font-family:var(--fd);font-size:1.6rem;font-weight:800;color:#0d2b5e;cursor:pointer;transition:all .15s;text-align:center;}
.pin-btn:active{background:#1565C0;border-color:#1565C0;color:#fff;transform:scale(.94);}
.pin-btn.del{color:#E8192C;}
.pin-btn.zero{grid-column:2;}

/* === Viewer mode (Phase 1) === */
/* Hide admin-only controls when no PIN is entered. */
body.viewer-mode .admin-only,
body.viewer-mode .manage-only { display: none !important; }
/* Manage tab nav button is still visible (it's the PIN gate), but its content
   shows only role-pick + PIN entry — the existing rManage() logic already
   gates inner content behind PIN, so we don't need to hide the tab itself. */
</style>
</head>
<body>
<div id="splash"><div class="sball">🏀</div><div class="slogo">HNGVR</div><div class="ssub">League Stats</div></div>
<div id="app">
  <div class="topbar">
    <div class="tlogo">🏀 HNGVR</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div id="sync-status" style="font-family:var(--fd);font-size:.7rem;color:rgba(255,255,255,.7);letter-spacing:1px">SEASON 5</div>
      <button onclick="forceSync()" id="sync-btn" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 10px;font-size:.72rem;color:#fff;cursor:pointer;font-family:var(--fd);font-weight:700;letter-spacing:.5px">↺ SYNC</button>
    </div>
  </div>
  <div class="main">

    <!-- HOME: News, Quotes, Social -->
    <div class="page active" id="page-home">
      <div id="home-content"></div>
    </div>

    <!-- GAMES: Schedule + Live scoreboard -->
    <div class="page" id="page-games">
      <div class="tabs" id="games-tabs" style="margin-bottom:0">
        <button class="tab active" onclick="switchGTab(this,'live')">Live / Schedule</button>
        <button class="tab" onclick="switchGTab(this,'history')">History</button>
      </div>
      <div id="wk-strip-container" style="margin:0 -14px"></div>
      <div id="games-content" style="margin-top:10px"></div>
      <div id="games-history" style="display:none"></div>
    </div>

    <!-- PLAYERS -->
    <div class="page" id="page-players">
      <div class="stitle">Players</div>
      <div class="tabs" id="rtabs">
        <button class="tab active" onclick="switchRTab(this,'active')">Active</button>
        <button class="tab" onclick="switchRTab(this,'past')">Past Players</button>
        <button class="tab" onclick="switchRTab(this,'teams')">Teams</button>
      </div>
      <div id="player-sub-controls">
        <div class="tabs" id="svtabs">
          <button class="tab active" onclick="switchSV(this,'season')">Season Avg</button>
          <button class="tab" onclick="switchSV(this,'career')">Career Avg</button>
        </div>
        <div class="fscroll" id="szn-chips"></div>
      </div>
      <div id="plist"></div>
    </div>

    <!-- HOF -->
    <div class="page" id="page-hof">
      <div class="stitle">Hall of Fame <span class="badge badge-gold">HNGVR</span></div>
      <div class="tabs"><button class="tab active" onclick="switchHofTab(this,'seasons')">Seasons</button><button class="tab" onclick="switchHofTab(this,'alltime')">All-Time</button></div>
      <div id="hof-content"></div>
    </div>

    <!-- MANAGE -->
    <div class="page" id="page-manage">
      <div class="stitle">Manage</div>
      <div id="manage-gate"></div>
    </div>

  </div>
  <nav class="bnav">

// ═══════════════════════════════════
// FIREBASE REAL-TIME SYNC (Phase 1 architecture)
// ═══════════════════════════════════
// Uses Firebase Realtime DB SDK v9 (compat) with onValue listeners
// instead of REST polling. Updates propagate sub-second when any
// device writes. Loaded from CDN in HTML.

const FB_CONFIG = {
  databaseURL: 'https://hngvr-bdc8b-default-rtdb.firebaseio.com'
};

let _fb = null;           // firebase.database() handle
let _fbInit = false;      // whether we've initialized the SDK
let _fbListeners = [];    // active onValue subscriptions, so we can detach if needed

// One-time SDK init
function fbInit(){
  if(_fbInit) return;
  if(typeof firebase === 'undefined' || !firebase.initializeApp){
    console.warn('Firebase SDK not loaded yet — retrying in 200ms');
    setTimeout(fbInit, 200);
    return;
  }
  firebase.initializeApp(FB_CONFIG);
  _fb = firebase.database();
  _fbInit = true;
  console.log('Firebase initialized');
  startFbSync();
}

// Push a single game to Firebase
function fbPushGame(game){
  if(!game || !_fb) return;
  _fb.ref('games/' + game.id).set(game).catch(e => console.warn('fbPushGame error', e));
}

// Delete a game from Firebase when finalized
function fbDeleteGame(id){
  if(!_fb) return;
  _fb.ref('games/' + id).remove().catch(()=>{});
}

// Subscribe to /games — fires on every server-side change, near-instant
function fbListenGames(){
  if(!_fb) return;
  const ref = _fb.ref('games');
  const handler = ref.on('value', (snap) => {
    const data = snap.val();
    console.log('[fb games] update received', data ? Object.keys(data).length + ' games' : 'no games');
    if(!data){
      // Server has no live games
      const had = S.games.some(g => g.status === 'live' || g.status === 'scheduled');
      if(had){
        S.games = S.games.filter(g => g.status === 'final');
        save();
        rGamesIfActive();
      }
      return;
    }
    let changed = false;
    const remoteIds = new Set();
    Object.values(data).forEach(fbGame => {
      if(!fbGame || !fbGame.id) return;
      remoteIds.add(fbGame.id);
      const idx = S.games.findIndex(g => g.id === fbGame.id);
      if(idx >= 0){
        if(JSON.stringify(S.games[idx]) !== JSON.stringify(fbGame)){
          if(!fbGame.plays) fbGame.plays = [];
          S.games[idx] = fbGame;
          changed = true;
        }
      } else {
        if(!fbGame.plays) fbGame.plays = [];
        S.games.push(fbGame);
        changed = true;
      }
    });
    // Remove any locally-known live/scheduled games that vanished from server
    const before = S.games.length;
    S.games = S.games.filter(g => g.status === 'final' || remoteIds.has(g.id));
    if(S.games.length !== before) changed = true;
    // Always save and re-render on every listener fire — ensures UI catches up
    // even if the user is mid-interaction or the diff-detection misses something.
    save();
    rGamesIfActive();
    rHomeIfActive();
    // If a game detail modal is open showing one of the updated games, refresh it too
    if(detailGameId){
      rGameDetailIfOpen(detailGameId);
    }
    // Light update: just clock displays on live games
    S.games.filter(g => g.status === 'live').forEach(g => {
      document.querySelectorAll(`[data-clockid="${g.id}"]`).forEach(el => { el.textContent = g.clk || '18:00'; });
    });
    console.log('[fb games] S.games now has', S.games.length, 'games');
  }, (err) => console.warn('games listener error', err));
  _fbListeners.push({ ref, handler });
}

// Subscribe to /teams
function fbListenTeams(){
  if(!_fb) return;
  const ref = _fb.ref('teams');
  const handler = ref.on('value', (snap) => {
    const data = snap.val();
    if(!data || !Array.isArray(data)) return;
    if(JSON.stringify(S.teams) !== JSON.stringify(data)){
      S.teams = data;
      save();
      rPlayersIfActive();
    }
  }, (err) => console.warn('teams listener error', err));
  _fbListeners.push({ ref, handler });
}

// Subscribe to /players (lightweight — name/active/photo only)
function fbListenPlayers(){
  if(!_fb) return;
  const ref = _fb.ref('players');
  const handler = ref.on('value', (snap) => {
    const data = snap.val();
    if(!data || !Array.isArray(data)) return;
    let changed = false;
    data.forEach(remote => {
      if(!remote) return;
      const local = S.players.find(p => p.id === remote.id);
      if(local){
        if(local.active !== remote.active || local.name !== remote.name || (local.photo || '') !== (remote.photo || '')){
          local.active = remote.active;
          local.name = remote.name;
          if(remote.photo) local.photo = remote.photo;
          changed = true;
        }
      } else {
        S.players.push({ id: remote.id, name: remote.name, active: remote.active, photo: remote.photo || '', seasons: {}, playoffs: {} });
        changed = true;
      }
    });
    if(changed){ save(); rPlayersIfActive(); rGamesIfActive(); }
  }, (err) => console.warn('players listener error', err));
  _fbListeners.push({ ref, handler });
}

// Subscribe to /news (headlines, quotes, social)
function fbListenNews(){
  if(!_fb) return;
  const ref = _fb.ref('news');
  const handler = ref.on('value', (snap) => {
    const data = snap.val();
    if(!data) return;
    if(JSON.stringify(S.news) !== JSON.stringify(data)){
      S.news = data;
      save();
      rHomeIfActive();
    }
  }, (err) => console.warn('news listener error', err));
  _fbListeners.push({ ref, handler });
}

// Helper renderers — only re-render the page if it's currently visible
function rGamesIfActive(){ if(document.getElementById('page-games') && document.getElementById('page-games').classList.contains('active')) rGames(); }
function rHomeIfActive(){ if(document.getElementById('page-home') && document.getElementById('page-home').classList.contains('active')) rHomePage(); }
function rPlayersIfActive(){ if(document.getElementById('page-players') && document.getElementById('page-players').classList.contains('active')) rPlayers(); }
// Re-render the game detail modal if it's currently open showing the given game
function rGameDetailIfOpen(gameId){
  if(detailGameId !== gameId) return;
  const g = gGame(gameId);
  if(!g) return;
  // Re-render entire modal (header with new scores, etc.) ...
  renderGameDetailModal(g);
  // ... then restore the currently-active sub-tab (feed / box1 / box2)
  const body = document.getElementById('game-detail-body');
  if(body){
    if(detailTab === 'feed'){ body.innerHTML = renderFeed(g); document.getElementById('gtab-feed')?.classList.add('active'); document.getElementById('gtab-box1')?.classList.remove('active'); document.getElementById('gtab-box2')?.classList.remove('active'); }
    else if(detailTab === 'box1'){ body.innerHTML = renderBoxScore(g,1); document.getElementById('gtab-feed')?.classList.remove('active'); document.getElementById('gtab-box1')?.classList.add('active'); document.getElementById('gtab-box2')?.classList.remove('active'); }
    else if(detailTab === 'box2'){ body.innerHTML = renderBoxScore(g,2); document.getElementById('gtab-feed')?.classList.remove('active'); document.getElementById('gtab-box1')?.classList.remove('active'); document.getElementById('gtab-box2')?.classList.add('active'); }
  }
}

// Activate all listeners. Called once SDK is initialized.
function startFbSync(){
  // small delay to let the rest of app finish initial render
  setTimeout(() => {
    console.log('Attaching Firebase listeners...');
    fbListenGames();
    fbListenTeams();
    fbListenPlayers();
    fbListenNews();
    console.log('All listeners attached');
    setSyncStatus('LIVE', '#16a34a');
  }, 500);
}

// Visual sync indicator
function setSyncStatus(text, color){
  const el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = text;
  if(color) el.style.color = color;
}

// Save game + push to Firebase
function saveGame(game){
  save();
  if(game && (game.status === 'live' || game.status === 'scheduled')) fbPushGame(game);
  if(game && game.status === 'final') fbDeleteGame(game.id);
}

// Push all teams to Firebase
function fbPushTeams(){
  if(!_fb) return;
  _fb.ref('teams').set(S.teams).catch(()=>{});
}

// Save teams locally + push to Firebase
function saveTeams(){
  save();
  fbPushTeams();
}

// Push news
function fbPushNews(){
  if(!_fb || !S.news) return;
  _fb.ref('news').set(S.news).catch(()=>{});
}

// Push players (slim — name, active, photo only)
function fbPushPlayers(){
  if(!_fb) return;
  const slim = S.players.map(p => ({ id: p.id, name: p.name, active: p.active, photo: p.photo || '' }));
  _fb.ref('players').set(slim).catch(()=>{});
}

// Manual force-sync (kept for the SYNC button UX). With listeners this just confirms
// connectivity and shows a toast — data is already real-time.
function forceSync(){
  if(!_fb){
    toast('Connecting...', '#1565C0');
    fbInit();
    return;
  }
  setSyncStatus('SYNCING...', '#1565C0');
  _fb.ref('.info/connected').once('value', (snap) => {
    if(snap.val()){
      setSyncStatus('LIVE', '#16a34a');
      toast('✓ Connected — live updates active');
    } else {
      setSyncStatus('OFFLINE', '#E8192C');
      toast('Offline — changes will sync when reconnected', '#E8192C');
    }
  });
}

// Backward-compat shims: some old code calls these. Now no-ops because listeners
// keep everything in sync automatically, but we still emit pushes for writes.
function fbPullGames(){ return Promise.resolve(); }
function fbPullTeams(){ return Promise.resolve(); }
function fbPullPlayers(){ return Promise.resolve(); }
function fbPullNews(){ return Promise.resolve(); }

function gp(id){return S.players.find(p=>p.id===id);}
function gGame(id){return S.games.find(g=>g.id===id);}
function ini(n){return n.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);}
function nc(n){let h=0;for(let c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h},60%,45%)`;}
function cAvg(p,s){const ss=Object.values(p.seasons).filter(x=>x.gp>0);if(!ss.length)return 0;const tg=ss.reduce((a,b)=>a+(b.gp||0),0);if(!tg)return 0;return +(ss.reduce((a,b)=>a+((b[s]||0)*(b.gp||0)),0)/tg).toFixed(1);}
function sAvg(p,s,z){const d=p.seasons[z];return d?+(d[s]||0).toFixed(1):'--';}
function seasonsPlayed(p){return Object.keys(p.seasons).length;}
function liveGames(){return S.games.filter(g=>g.status==='live');}
function teamsInLive(){return liveGames().flatMap(g=>[g.n1,g.n2]);}
function toast(m,c='#16a34a'){const e=document.getElementById('toast');e.textContent=m;e.style.background=c;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200);}

function goPage(n,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
  if(btn)btn.classList.add('active');
  // Phase 1: remember the active tab so refresh restores it
  try { localStorage.setItem('hngvr_lastTab', n); } catch(e){}
  if(n==='home')rHomePage();
  else if(n==='games'){rGames();}
  else if(n==='players')rPlayers();
  else if(n==='hof')rHof();
  else if(n==='manage')rManage();
}

const S5_WEEKS=[
  {id:'W1',label:'W1',dates:'Jun 19/21',fri:'Eli vs Elliot',sun1:'Aaron vs Eric',sun2:'Eddie vs Larry'},
  {id:'W2',label:'W2',dates:'Jun 26/28',fri:'Elliot vs Larry',sun1:'Aaron vs Max',sun2:'Eddie vs Eli'},
  {id:'W3',label:'W3',dates:'Jul 3/5',fri:'Eddie vs Eric',sun1:'Max vs Elliot',sun2:'Eli vs Larry'},
  {id:'W4',label:'W4',dates:'Jul 10/12',fri:'Max vs Eli',sun1:'Aaron vs Elliot',sun2:'Larry vs Eric'},
  {id:'W5',label:'W5',dates:'Jul 17/19',fri:'Aaron vs Eddie',sun1:'Max vs Larry',sun2:'Eli vs Eric'},
  {id:'W6',label:'W6',dates:'Jul 24/26',fri:'Aaron vs Larry',sun1:'Max vs Eddie',sun2:'Elliot vs Eric'},
  {id:'W7',label:'W7',dates:'Jul 31/Aug 2',fri:'Max vs Eric',sun1:'Aaron vs Eli',sun2:'Elliot vs Eddie'},
];
let activeWk='all';

function rGames(){
  const el=document.getElementById('games-content');
  if(!el)return;
  const live=S.games.filter(g=>g.status==='live');
  const sched=S.games.filter(g=>g.status==='scheduled').sort((a,b)=>new Date(a.date+' '+a.time)-new Date(b.date+' '+b.time));
  const finals=[...S.games.filter(g=>g.status==='final')].reverse();

  // Build week strip
  const liveTeams=new Set(live.flatMap(g=>[g.n1,g.n2]));
  function wkHasLive(wk){
    return live.some(g=>g.n1.includes(wk.fri.split(' vs ')[0])||g.n1.includes(wk.sun1.split(' vs ')[0]));
  }
  let strip=`<div class="wk-strip"><div class="wk-chip${activeWk==='all'?' active':''}" onclick="setWk('all')">All</div>`;
  S5_WEEKS.forEach(w=>{
    const hl=live.some(g=>[w.fri,w.sun1,w.sun2].some(m=>{const [a,b]=m.split(' vs ');return(g.n1.includes(a)&&g.n2.includes(b))||(g.n1.includes(b)&&g.n2.includes(a));}));
    strip+=`<div class="wk-chip${activeWk===w.id?' active':''}${hl?' has-live':''}" onclick="setWk('${w.id}')">${w.label}<br><span style="font-size:.55rem;font-weight:600;opacity:.7">${w.dates}</span></div>`;
  });
  strip+=`</div>`;

  // Filter games by active week
  function filterByWk(games){
    if(activeWk==='all')return games;
    const wk=S5_WEEKS.find(w=>w.id===activeWk);
    if(!wk)return games;
    const pairs=[wk.fri,wk.sun1,wk.sun2].map(m=>m.split(' vs ').map(n=>n.trim()));
    return games.filter(g=>pairs.some(([a,b])=>(g.n1.includes(a)&&g.n2.includes(b))||(g.n1.includes(b)&&g.n2.includes(a))));
  }

  let html='';
  const filtLive=filterByWk(live);
  const filtSched=filterByWk(sched);
  const filtFinal=filterByWk(finals).slice(0,activeWk==='all'?10:20);

  if(filtLive.length){html+=`<div class="game-section-label">🔴 Live Now</div>`;html+=filtLive.map(g=>gameCard(g)).join('');}
  if(filtSched.length){html+=`<div class="game-section-label">Upcoming</div>`;html+=filtSched.map(g=>gameCard(g)).join('');}
  if(filtFinal.length){html+=`<div class="game-section-label">Recent Results</div>`;html+=filtFinal.map(g=>gameCard(g)).join('');}
  if(!filtLive.length&&!filtSched.length&&!filtFinal.length){html=`<div style="text-align:center;padding:60px 20px;color:#8899bb"><div style="font-size:3rem;margin-bottom:12px">🏀</div><div style="font-family:var(--fd);font-size:1.4rem;font-weight:700;color:#4a5f8a">${activeWk==='all'?'No Games Yet':'No Games This Week'}</div><div style="font-size:.85rem;margin-top:8px">${activeWk==='all'?'Schedule games in Manage → Schedule':'Check another week or come back later'}</div></div>`;}
  
  // Inject strip into page above content
  const stripEl=document.getElementById('wk-strip-container');
  if(stripEl){stripEl.innerHTML=strip;}
  el.innerHTML=html;
}

function setWk(id){activeWk=id;rGames();}

function gameCard(g){
  const isLive=g.status==='live';
  const isFinal=g.status==='final';
  const isSched=g.status==='scheduled';
  const w1=isFinal&&g.s1>g.s2, w2=isFinal&&g.s2>g.s1;

  let statusHTML='';
  const r1=getS5Record(g.n1), r2=getS5Record(g.n2);
  const recStr=`<span style="font-size:.65rem;color:#8899bb;font-weight:600;margin-left:auto">${r1.w}-${r1.l} · ${r2.w}-${r2.l}</span>`;
  if(isLive) statusHTML=`<div class="game-status-live"><div class="live-pip"></div><span style="font-weight:800">${halfLabel(g.half)}</span>&nbsp;·&nbsp;<span data-clockid="${g.id}">${g.clk||'18:00'}</span>${g.clkRunning?'':' <span style="opacity:.6">⏸</span>'}${recStr}</div>`;
  else if(isFinal) statusHTML=`<div class="game-status-final" style="display:flex;align-items:center;width:100%"><span>Final</span><span style="font-size:.65rem;color:#8899bb;font-weight:600;margin-left:6px">${fmtDate(g.date)}</span>${recStr}</div>`;
  else statusHTML=`<div class="game-status-sched" style="display:flex;align-items:center;width:100%"><span>${fmtDate(g.date)} · ${g.time||'TBD'}</span>${recStr}</div>`;

  let scoreHTML='';
  if(isLive||isFinal){
    scoreHTML=`
      <div class="team-col"><div class="team-name-gc">${g.n1}</div></div>
      <div class="team-score-gc ${w1?'winner':''}">${g.s1}</div>
      <div class="score-sep">–</div>
      <div class="team-score-gc ${w2?'winner':''}" style="text-align:right">${g.s2}</div>
      <div class="team-col" style="text-align:right"><div class="team-name-gc" style="text-align:right">${g.n2}</div></div>`;
  } else {
    scoreHTML=`
      <div class="team-col"><div class="team-name-gc">${g.n1}</div></div>
      <div class="game-time-col"><div class="game-tipoff">${g.time||'TBD'}</div></div>
      <div class="team-col" style="text-align:right"><div class="team-name-gc" style="text-align:right">${g.n2}</div></div>`;
  }

  return `<div class="game-card ${isLive?'live-card':''}" onclick="openGameDetail('${g.id}')">
    <div class="game-card-header">${statusHTML}</div>
    <div class="game-card-body">${scoreHTML}</div>
  </div>`;
}

function halfLabel(h){
  if(h===1)return '1st Half';
  if(h===2)return '2nd Half';
  if(h===3)return 'OT';
  return 'Pre-Game';
}

function getS5Record(teamName){
  // Count W/L from S5 final games in S.games
  let w=0,l=0;
  S.games.filter(g=>g.status==='final'&&(g.n1===teamName||g.n2===teamName)).forEach(g=>{
    const won=(g.n1===teamName&&g.s1>g.s2)||(g.n2===teamName&&g.s2>g.s1);
    if(won)w++;else l++;
  });
  return{w,l};
}

function fmtDate(d){
  if(!d)return '';
  try{const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
  catch(e){return d;}
}

function switchGameTab(id,tab,el){
  document.querySelectorAll('.gdh-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  detailTab=tab;
  const g=gGame(id);if(!g)return;
  if(tab==='feed') document.getElementById('game-detail-body').innerHTML=renderFeed(g);
  else if(tab==='box1') document.getElementById('game-detail-body').innerHTML=renderBoxScore(g,1);
  else document.getElementById('game-detail-body').innerHTML=renderBoxScore(g,2);
}

function renderFeed(g){
  if(!g.plays||!g.plays.length) return `<div style="text-align:center;padding:30px;color:#8899bb;font-size:.9rem">No plays logged yet</div>`;
  const plays=[...g.plays].reverse();
  return `<div class="play-feed">${plays.map(pl=>{
    const player=gp(pl.pid);
    const pname=player?player.name:'—';
    const col=pl.team===1?nc(g.n1):nc(g.n2);
    const tname=pl.team===1?g.n1:g.n2;
    let actionLabel='', badge='';
    if(pl.pts===1){actionLabel='Free Throw';badge=`<span class="play-pts-badge pts-score">+1</span>`;}
    else if(pl.pts===2){actionLabel='2-pt Bucket';badge=`<span class="play-pts-badge pts-score">+2</span>`;}
    else if(pl.pts===3){actionLabel='3-pointer';badge=`<span class="play-pts-badge pts-score">+3</span>`;}
    else if(pl.type==='Rebound'){actionLabel='Rebound';badge=`<span class="play-pts-badge pts-def">REB</span>`;}
    else if(pl.type==='Assist'){actionLabel='Assist';badge=`<span class="play-pts-badge pts-def">AST</span>`;}
    else if(pl.type==='Stock'){actionLabel='Stock (Stl/Blk)';badge=`<span class="play-pts-badge pts-def">STK</span>`;}
    return `<div class="play-entry">
      <div class="play-av" style="background:${col}">${ini(pname)}</div>
      <div class="play-body">
        <div class="play-action">${pname}${badge}</div>
        <div class="play-meta">${tname} · ${pl.clk||''}</div>
      </div>
      <div class="play-score-snap">${pl.snap1}–${pl.snap2}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderBoxScore(g,team){
  const roster=team===1?(g.roster1||[]):(g.roster2||[]);
  const tname=team===1?g.n1:g.n2;
  if(!roster.length) return `<div style="text-align:center;padding:30px;color:#8899bb;font-size:.9rem">No players rostered for ${tname}</div>`;

  // tally per-game stats from plays
  const stats={};
  roster.forEach(pid=>{stats[pid]={pts:0,reb:0,ast:0,stk:0};});
  (g.plays||[]).forEach(pl=>{
    if(pl.team!==team||!pl.pid||!stats[pl.pid])return;
    if(pl.pts>0)stats[pl.pid].pts+=pl.pts;
    else if(pl.type==='Rebound')stats[pl.pid].reb++;
    else if(pl.type==='Assist')stats[pl.pid].ast++;
    else if(pl.type==='Stock')stats[pl.pid].stk++;
  });

  const rows=roster.map(pid=>{
    const p=gp(pid);if(!p)return '';
    const st=stats[pid]||{pts:0,reb:0,ast:0,stk:0};
    return `<tr><td>${p.name}</td><td>${st.pts}</td><td>${st.reb}</td><td>${st.ast}</td><td>${st.stk}</td></tr>`;
  }).join('');

  const totals=roster.reduce((acc,pid)=>{const st=stats[pid]||{};acc.pts+=(st.pts||0);acc.reb+=(st.reb||0);acc.ast+=(st.ast||0);acc.stk+=(st.stk||0);return acc;},{pts:0,reb:0,ast:0,stk:0});

  return `<div>
    <span class="box-team-header" style="color:${nc(tname)}">${tname}</span>
    <table class="box-table">
      <thead><tr><th style="text-align:left">Player</th><th>PTS</th><th>REB</th><th>AST</th><th>STK</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="border-top:1px solid #eef2f8"><td style="font-weight:700;color:#4a5f8a">Team</td><td style="color:#E8192C;font-family:var(--fd);font-weight:800">${totals.pts}</td><td>${totals.reb}</td><td>${totals.ast}</td><td>${totals.stk}</td></tr></tfoot>
    </table>
  </div>`;
}

let pinBuffer='';

function rLiveAdmin(){
  const el=document.getElementById('live-admin');
  if(!pinUnlocked){renderPinGate(el);return;}
  renderAdminPanel(el);
}

function renderPinGate(el){
  pinBuffer='';
  el.innerHTML=`
    <div class="pin-gate">
      <div style="font-family:var(--fd);font-size:1rem;font-weight:700;color:#4a5f8a;letter-spacing:2px;text-transform:uppercase">Admin PIN Required</div>
      <div class="pin-display" id="pin-display">_ _ _ _</div>
      <div class="pin-pad" id="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="pin-btn" onclick="pinPress('${n}')">${n}</div>`).join('')}
        <div class="pin-btn zero" onclick="pinPress('0')">0</div>
        <div class="pin-btn del" onclick="pinDel()">⌫</div>
      </div>
    </div>`;
}

function pinPress(n){
  if(pinBuffer.length>=4)return;
  pinBuffer+=n;
  updatePinDisplay();
  if(pinBuffer.length===4){
    if(pinBuffer===PIN){
      pinUnlocked=true;
      setTimeout(()=>renderAdminPanel(document.getElementById('live-admin')),300);
      toast('Stat Keeper Access 🔓');
    } else if(pinBuffer===OWNER_PIN){
      pinUnlocked=true;
      ownerUnlocked=true;
      setTimeout(()=>renderAdminPanel(document.getElementById('live-admin')),300);
      toast('Owner Access 🔓👑');
    } else {
      setTimeout(()=>{pinBuffer='';updatePinDisplay();toast('Wrong PIN','#E8192C');},400);
    }
  }
}
function pinDel(){if(pinBuffer.length)pinBuffer=pinBuffer.slice(0,-1);updatePinDisplay();}
function updatePinDisplay(){
  const el=document.getElementById('pin-display');if(!el)return;
  const dots=pinBuffer.split('').map(()=>'●').join(' ');
  const blanks=Array(4-pinBuffer.length).fill('_').join(' ');
  el.textContent=(dots+(blanks?(' '+blanks):'')).trim();
}

function renderAdminPanel(el){
  const live=liveGames();

function renderAdminGameModal(g){
  const isLive=g.status==='live';
  const ap=S.players.filter(p=>p.active);
  const t1color=S.teams.find(t=>t.name===g.n1)?.color||'#1565C0';
  const t2color=S.teams.find(t=>t.name===g.n2)?.color||'#1565C0';

  let html=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eef2f8">

      </div>

        <div style="font-size:.65rem;letter-spacing:1px;text-transform:uppercase;color:${t2color};font-weight:700">${g.n2}</div>

      </div>
    </div>`;

  if(!isLive){
    // Pre-game: roster setup
    const team1=S.teams.find(t=>t.name===g.n1);
    const team2=S.teams.find(t=>t.name===g.n2);
    const pre1=team1?team1.playerIds:(g.roster1||[]);
    const pre2=team2?team2.playerIds:(g.roster2||[]);
    // Build per-player sub rows for a team
    const subRows=(playerIds, teamNum, teamColor, teamName)=>{
      const players = playerIds.map(pid=>S.players.find(p=>p.id===pid)).filter(Boolean);
      const existingSubs = (g.subs||[]).filter(s=>s.team===teamNum);

        <div style="font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:${teamColor};font-weight:700;margin:12px 0 8px">${teamName}</div>

              <label style="display:flex;align-items:center;gap:6px;font-size:.75rem;color:#8899bb;cursor:pointer">
                <input type="checkbox" id="sub-chk-${p.id}" ${existing?'checked':''} onchange="toggleSubRow(${p.id},${teamNum})" style="cursor:pointer">

    };

    html+=`
      <div style="font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:#8899bb;font-weight:700;margin-bottom:10px">Confirm Rosters & Subs</div>
      ${subRows(pre1, 1, t1color, g.n1)}

    return html;

  // Live: 4 tabs
  const tabs=[

    t.style.color=isActive?'#1565C0':'#8899bb';

function getGameStats(g){
  const stats={};
  [...(g.roster1||[]),...(g.roster2||[])].forEach(pid=>{stats[pid]={pts:0,reb:0,ast:0,stk:0};});
  (g.plays||[]).forEach(pl=>{
    if(!pl.pid||!stats[pl.pid])return;
    if(pl.pts>0)stats[pl.pid].pts+=pl.pts;
    else if(pl.type==='Rebound')stats[pl.pid].reb++;
    else if(pl.type==='Assist')stats[pl.pid].ast++;
    else if(pl.type==='Stock')stats[pl.pid].stk++;
  });
  return stats;
}

// ═══════════════════════════════════
// LIVE CLOCK ENGINE
// ═══════════════════════════════════
// Each game stores: g.clkSecs (seconds remaining), g.clkRunning (bool), g.clkLastTick (timestamp ms)
// Global interval drives all running clocks

let _clockInterval=null;

function startClockEngine(){
  if(_clockInterval)return;
  let _fbClockTick=0;
  _clockInterval=setInterval(()=>{
    let anyRunning=false;
    S.games.forEach(g=>{
      if(g.status!=='live'||!g.clkRunning)return;
      anyRunning=true;
      const now=Date.now();
      const elapsed=Math.floor((now-(g.clkLastTick||now))/1000);
      if(elapsed>0){
        g.clkSecs=Math.max(0,(g.clkSecs||0)-elapsed);
        g.clkLastTick=now;
        g.clk=secsToClk(g.clkSecs);
        if(g.clkSecs===0){
          g.clkRunning=false;
          saveGame(g);
          toast(`⏰ Time's up — ${halfLabel(g.half)}!`,'#E8192C');
        }
      }
    });
    if(anyRunning){
      save();
      // Push clock to Firebase every 10 seconds
      _fbClockTick++;
      if(_fbClockTick>=20){
        _fbClockTick=0;
        S.games.filter(g=>g.status==='live'&&g.clkRunning).forEach(g=>fbPushGame(g));
      }
      // Update clock displays without full re-render
      S.games.filter(g=>g.status==='live').forEach(g=>{
        document.querySelectorAll(`[data-clockid="${g.id}"]`).forEach(el=>{el.textContent=g.clk;});
        const inp=document.getElementById('gclk');
        if(inp&&activeGameId===g.id)inp.value=g.clk;
        const hdrClk=document.getElementById('admin-hdr-clk');
        if(hdrClk&&activeGameId===g.id)hdrClk.textContent=g.clk;
      });
    }
  },500);
}

function secsToClk(s){
  const m=Math.floor(s/60);
  const sec=s%60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function clkToSecs(clk){
  if(!clk)return 0;
  const parts=clk.split(':');
  return parseInt(parts[0])*60+(parseInt(parts[1])||0);
}

function halfDefaultSecs(half){
  return half===3?180:1080; // OT=3min, halves=18min
}

function toggleClock(gid){
  const g=gGame(gid);if(!g)return;
  if(g.clkRunning){
    // Pause
    g.clkRunning=false;
    // Sync any manual edits to clkSecs
    const inp=document.getElementById('gclk');
    if(inp){g.clk=inp.value;g.clkSecs=clkToSecs(inp.value);}
  } else {
    // Start — sync from input first
    const inp=document.getElementById('gclk');
    if(inp){g.clk=inp.value;g.clkSecs=clkToSecs(inp.value);}
    if(!g.clkSecs)g.clkSecs=halfDefaultSecs(g.half);
    g.clkRunning=true;
    g.clkLastTick=Date.now();
  }
  saveGame(g);
  // Re-render just the clock controls
  const btn=document.getElementById('clk-toggle-btn');
  if(btn){btn.textContent=g.clkRunning?'⏸ Pause':'▶ Start';btn.style.background=g.clkRunning?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';btn.style.color=g.clkRunning?'#E8192C':'#16a34a';}
}

function resetClock(gid){
  const g=gGame(gid);if(!g)return;
  g.clkRunning=false;
  g.clkSecs=halfDefaultSecs(g.half);
  g.clk=secsToClk(g.clkSecs);
  g.clkLastTick=null;
  saveGame(g);
  const inp=document.getElementById('gclk');if(inp)inp.value=g.clk;
  const btn=document.getElementById('clk-toggle-btn');
  if(btn){btn.textContent='▶ Start';btn.style.background='rgba(34,197,94,.15)';btn.style.color='#16a34a';}
  document.querySelectorAll(`[data-clockid="${gid}"]`).forEach(el=>{el.textContent=g.clk;});
  toast('Clock reset');
}

  g.half=parseInt(document.getElementById('ghalf')?.value)||g.half;
  // Reset secs if half changed and no manual time set
  if(!inp?.value)g.clkSecs=halfDefaultSecs(g.half);

}

function logPlay2(id,pts,type){
  const g=gGame(id);if(!g)return;
  const team=parseInt(document.getElementById('pteam')?.value)||1;

  const clk=document.getElementById('gclk')?.value||g.clk;

  if(!g.plays)g.plays=[];
  g.plays.push({team,pid,pts,type,clk,snap1,snap2,astPid:null});
  if(pts>0){if(team===1)g.s1+=pts;else g.s2+=pts;}
  saveGame(g);document.getElementById('mb').innerHTML=renderAdminGameModal(g);rGames();
  toast(pts>0?`+${pts} · ${team===1?g.n1:g.n2}`:`${gp(pid)?.name||type} · ${type}`);

function undoPlay2(id){
  const g=gGame(id);if(!g||!g.plays?.length)return;
  const last=g.plays.pop();
  // Also remove the assist entry if it was paired
  if(last.pts>0&&g.plays.length&&g.plays[g.plays.length-1].type==='Assist'){g.plays.pop();}
  if(last.pts>0){if(last.team===1)g.s1=Math.max(0,g.s1-last.pts);else g.s2=Math.max(0,g.s2-last.pts);}
  selectedPlayer=null;
  saveGame(g);document.getElementById('mb').innerHTML=renderAdminGameModal(g);rGames();toast('Undone ↩');
}

function savePlayerPhoto(id){
  const p=gp(id);if(!p)return;
  const urlInput=document.getElementById('photo-url').value.trim();
  const fileInput=document.getElementById('photo-file');
  function applyAndRefresh(){
    save();
    fbPushPlayers();
    // Rebuild the player profile in-place (modal already open)
    showP(id);
    toast('Photo saved! 📸');
  }
  if(fileInput&&fileInput.files&&fileInput.files[0]){
    const reader=new FileReader();
    reader.onload=e=>{p.photo=e.target.result;applyAndRefresh();};
    reader.readAsDataURL(fileInput.files[0]);
  } else if(urlInput){
    p.photo=urlInput;applyAndRefresh();
  } else {
    p.photo='';save();fbPushPlayers();showP(id);toast('Photo removed');
  }
}

      </div>

      (manageRole==='commissioner'&&managePinBuf===PIN_COMMISSIONER)||
      (manageRole==='statkeeper'&&managePinBuf===PIN_STATKEEPER)||
      (manageRole==='analyst'&&managePinBuf===PIN_ANALYST);

      if(manageRole==='commissioner'){ownerUnlocked=true;pinUnlocked=true;}

      setTimeout(()=>{managePinBuf='';updateManagePinDisplay();toast('Wrong PIN','#E8192C');},400);

  }

function createTeam(){
  const name=document.getElementById('tname').value.trim();
  if(!name){toast('Enter a team name','#E8192C');return;}
  const capId=parseInt(document.getElementById('tcap').value)||null;
  if(!capId){toast('Select a captain','#E8192C');return;}
  const p2=parseInt(document.getElementById('tp2').value)||null;
  const p3=parseInt(document.getElementById('tp3').value)||null;
  const p4=parseInt(document.getElementById('tp4').value)||null;
  const playerIds=[capId,p2,p3,p4].filter(Boolean);
  // Check for duplicates within this team
  if(new Set(playerIds).size!==playerIds.length){toast('A player appears twice','#E8192C');return;}
  // Check for players already on another team
  const takenIds=S.teams.flatMap(t=>t.playerIds);
  const conflict=playerIds.find(id=>takenIds.includes(id));
  if(conflict){const p=gp(conflict);toast(`${p?p.name:'Player'} is already on a team`,'#E8192C');return;}
  S.teams.push({id:'t'+Date.now(),name,color:selectedTeamColor,captainId:capId,playerIds});
  document.getElementById('tname').value='';
  ['tcap','tp2','tp3','tp4'].forEach(id=>{document.getElementById(id).value='';});
  selectedTeamColor=TEAM_COLORS[0];
  saveTeams();rTeams();toast(`${name} created! 🏀`);
}

function deleteTeam(id){
  S.teams=S.teams.filter(t=>t.id!==id);
  saveTeams();rTeams();toast('Team removed');
}

function openTrade(teamId){
  const team=S.teams.find(t=>t.id===teamId);
  if(!team)return;
  const otherTeams=S.teams.filter(t=>t.id!==teamId);
  if(!otherTeams.length){toast('Need at least 2 teams to trade','#E8192C');return;}

  document.getElementById('mb').innerHTML=`
    <div class="mt2">🔄 Trade — ${team.name}</div>
    <div style="font-size:.8rem;color:#8899bb;margin-bottom:16px">Select players to swap between teams</div>

    <div class="fg">
      <label class="fl" style="color:${team.color||'#1565C0'}">From: ${team.name}</label>
      <select class="fs" id="trade-from-player">
        <option value="">Select player to trade away...</option>
        ${team.playerIds.map(id=>{const p=gp(id);return p?`<option value="${id}">${p.name}${id===team.captainId?' 👑':''}</option>`:''}).join('')}
      </select>
    </div>

    <div class="fg">
      <label class="fl">To Team</label>
      <select class="fs" id="trade-to-team" onchange="updateTradeTargetPlayers('${teamId}')">
        <option value="">Select team...</option>
        ${otherTeams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
      </select>
    </div>

    <div class="fg" id="trade-to-player-wrap" style="display:none">
      <label class="fl" id="trade-to-label">Receive</label>
      <select class="fs" id="trade-to-player">
        <option value="">Select player to receive (optional)...</option>
      </select>
    </div>

    <div style="background:#f4f6fb;border:1px solid #dde4f0;border-radius:10px;padding:12px;margin-bottom:16px;font-size:.78rem;color:#8899bb">
      💡 Select a player to receive for a <strong style="color:#4a5f8a">swap</strong>, or leave blank for a <strong style="color:#4a5f8a">one-way trade</strong>
    </div>

    <button class="btn btp" onclick="executeTrade('${teamId}')">✅ Confirm Trade</button>`;
  openModal();
}

function updateTradeTargetPlayers(fromTeamId){
  const toTeamId=document.getElementById('trade-to-team').value;
  const wrap=document.getElementById('trade-to-player-wrap');
  const label=document.getElementById('trade-to-label');
  if(!toTeamId){wrap.style.display='none';return;}
  const toTeam=S.teams.find(t=>t.id===toTeamId);
  if(!toTeam){wrap.style.display='none';return;}
  label.textContent=`Receive from ${toTeam.name} (optional)`;
  const sel=document.getElementById('trade-to-player');
  sel.innerHTML=`<option value="">None — one-way trade</option>`+
    toTeam.playerIds.map(id=>{const p=gp(id);return p?`<option value="${id}">${p.name}${id===toTeam.captainId?' 👑':''}</option>`:''}).join('');
  wrap.style.display='block';
}

function executeTrade(fromTeamId){
  const fromTeam=S.teams.find(t=>t.id===fromTeamId);
  if(!fromTeam)return;
  const fromPid=parseInt(document.getElementById('trade-from-player').value)||null;
  const toTeamId=document.getElementById('trade-to-team').value;
  const toPid=parseInt(document.getElementById('trade-to-player').value)||null;

  if(!fromPid){toast('Select a player to trade','#E8192C');return;}
  if(!toTeamId){toast('Select a team to trade to','#E8192C');return;}

  const toTeam=S.teams.find(t=>t.id===toTeamId);
  if(!toTeam)return;

  const fromPlayer=gp(fromPid);
  const toPlayer=toPid?gp(toPid):null;

  // Remove fromPid from fromTeam, add to toTeam
  fromTeam.playerIds=fromTeam.playerIds.filter(id=>id!==fromPid);
  toTeam.playerIds.push(fromPid);

  // If captain traded away, make first remaining player captain
  if(fromTeam.captainId===fromPid&&fromTeam.playerIds.length>0){
    fromTeam.captainId=fromTeam.playerIds[0];
  }

  // If swap: remove toPid from toTeam, add to fromTeam
  if(toPid){
    toTeam.playerIds=toTeam.playerIds.filter(id=>id!==toPid);
    fromTeam.playerIds.push(toPid);
    if(toTeam.captainId===toPid&&toTeam.playerIds.length>0){
      toTeam.captainId=toTeam.playerIds[0];
    }
    toast(`🔄 ${fromPlayer?.name} ↔ ${toPlayer?.name} trade complete!`);
  } else {
    toast(`🔄 ${fromPlayer?.name} traded to ${toTeam.name}!`);
  }

  saveTeams();
  closeModal();
  rTeams();
}

function switchGTab(btn,tab){
  document.querySelectorAll('#games-tabs .tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('games-content').style.display = tab==='live'?'':'none';
  const hEl = document.getElementById('games-history');
  if(tab==='history'){hEl.style.display='';rHistory();}
  else hEl.style.display='none';
}

function rHistory(){
  const el=document.getElementById('games-history');
  if(!el)return;

  // Selected season state
  if(!window._histSzn) window._histSzn=4;
  const szn = window._histSzn;

  const ROUND_ORDER=['Week 1','Week 2','Week 3','Week 4','Week 5','Week 6','Week 7',
    'Play-In','Quarter Finals','Semi Finals','Finals'];
  const PLAYOFF_ROUNDS=['Play-In','Quarter Finals','Semi Finals','Finals'];
  const ROUND_BADGE={
    'Play-In':'🎟️ Play-In','Quarter Finals':'🏆 Quarter Finals','Semi Finals':'🏆 Semi Finals','Finals':'🏆 Finals'
  };

  // Merge HIST_GAMES with completed S5 games from S.games
  let games = HIST_GAMES.filter(g=>g.s===szn);
  if(szn===5){
    const s5done = S.games.filter(g=>g.status==='final'&&g.season===5).map(g=>({
      id:g.id, s:5, r:g.round||'Week 1', d:g.date||'', t1:g.n1, s1:g.s1, t2:g.n2, s2:g.s2, box1:[], box2:[]
    }));
    games = [...games, ...s5done];
  }
  const rounds = [...new Set(games.map(g=>g.r))].sort((a,b)=>ROUND_ORDER.indexOf(a)-ROUND_ORDER.indexOf(b));

  // Season selector tabs
  let html = '<div class="fscroll" style="gap:8px;padding:12px 0 4px">'
    +[1,2,3,4,5].map(s=>`<button onclick="window._histSzn=${s};rHistory()" style="background:${s===szn?'#1565C0':'#f4f6fb'};color:${s===szn?'#fff':'#4a5f8a'};border:none;border-radius:20px;padding:6px 16px;font-family:var(--fd);font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap">Season ${s}</button>`).join('')
    +'</div>';

  rounds.forEach(round=>{
    const rGames = games.filter(g=>g.r===round);
    const isPlayoff = PLAYOFF_ROUNDS.includes(round);
    const label = ROUND_BADGE[round] || round;

    html += `<div class="game-section-label" style="margin-top:16px">${label}</div>`;

    rGames.forEach(g=>{
      const w1=g.s1>g.s2, w2=g.s2>g.s1;
      const hasBox = g.box1&&g.box1.length>0;
      html += `<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">
        <!-- Score header -->
        <div style="display:flex;align-items:center;padding:12px 14px;gap:8px;cursor:${hasBox?'pointer':'default'}" ${hasBox?`onclick="toggleBox(${g.id})"`:''}> 
          <div style="flex:1;min-width:0">
            <div style="font-family:var(--fd);font-size:.88rem;font-weight:${w1?'900':'600'};color:${w1?'#0d2b5e':'#4a5f8a'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${w1?'🏆 ':''}${g.t1.split(' ')[1]}
            </div>
          </div>
          <div style="font-family:var(--fd);font-size:1.4rem;font-weight:900;color:${w1?'#1565C0':'#4a5f8a'}">
            ${g.s1}
          </div>
          <div style="font-size:.75rem;color:#8899bb;padding:0 4px">—</div>
          <div style="font-family:var(--fd);font-size:1.4rem;font-weight:900;color:${w2?'#1565C0':'#4a5f8a'}">
            ${g.s2}
          </div>
          <div style="flex:1;min-width:0;text-align:right">
            <div style="font-family:var(--fd);font-size:.88rem;font-weight:${w2?'900':'600'};color:${w2?'#0d2b5e':'#4a5f8a'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${g.t2.split(' ')[1]}${w2?' 🏆':''}
            </div>
          </div>
          ${hasBox?`<div style="font-size:.7rem;color:#8899bb;margin-left:4px">▾</div>`:''}
        </div>
        ${g.date?`<div style="font-size:.65rem;color:#8899bb;padding:0 14px 8px;margin-top:-6px">${g.date}</div>`:''}
        <!-- Box score (hidden by default) -->
        ${hasBox?`<div id="box-${g.id}" style="display:none;border-top:1px solid #eef2f8">
          ${renderBoxScore(g)}
        </div>`:''}
      </div>`;
    });
  });

  el.innerHTML = html;
}

function renderBoxScore(g){
  const cols = g.s>=2;
  const hdr = cols
    ? '<div style="font-size:.62rem;color:#8899bb;font-weight:700;text-align:right;padding:0 12px 4px;display:grid;grid-template-columns:1fr 36px 36px 36px 36px"><span></span><span>PTS</span><span>REB</span><span>AST</span><span>STK</span></div>'
    : '<div style="font-size:.62rem;color:#8899bb;font-weight:700;text-align:right;padding:0 12px 4px;display:grid;grid-template-columns:1fr 36px 36px 36px"><span></span><span>PTS</span><span>REB</span><span>AST</span></div>';

  function teamRows(box, teamName, score){
    if(!box||!box.length) return '<div style="padding:12px;color:#8899bb;font-size:.75rem;text-align:center">No stats recorded</div>';
    const grid = cols ? '1fr 36px 36px 36px 36px' : '1fr 36px 36px 36px';
    return `<div style="padding:8px 12px">
      <div style="font-family:var(--fd);font-size:.72rem;font-weight:800;color:#E8192C;margin-bottom:6px">${teamName.split(' ')[1].toUpperCase()} · ${score}</div>
      ${box.map(p=>{
        const isSub=p.sf;
        const nameStr=isSub
          ? `<div style="font-size:.75rem;font-weight:500">${p.n} <span style="font-size:.62rem;color:#8899bb;font-style:italic">(sub for ${p.sf})</span></div>`
          : `<div style="font-size:.75rem;font-weight:500">${p.n}</div>`;
        return `<div style="display:grid;grid-template-columns:${grid};padding:3px 0;border-bottom:1px solid #eef2f8">
          ${nameStr}
          <div style="font-size:.78rem;font-weight:700;text-align:right">${p.p}</div>
          <div style="font-size:.78rem;color:#4a5f8a;text-align:right">${p.r}</div>
          <div style="font-size:.78rem;color:#4a5f8a;text-align:right">${p.a}</div>
          ${cols?`<div style="font-size:.78rem;color:#4a5f8a;text-align:right">${p.s||0}</div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }

  return hdr
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0">'
    + teamRows(g.box1, g.t1, g.s1)
    + teamRows(g.box2, g.t2, g.s2)
    + '</div>';
}

function toggleBox(gid){
  const el=document.getElementById('box-'+gid);
  if(!el)return;
  el.style.display = el.style.display==='none'?'':'none';
}

function forceSync(){
  const btn=document.getElementById('sync-btn');
  const status=document.getElementById('sync-status');
  if(btn){btn.textContent='↺ SYNCING...';btn.style.color='#1565C0';}
  Promise.all([fbPullGames(),fbPullTeams(),fbPullPlayers(),fbPullNews()]).then(()=>{
    if(btn){btn.textContent='↺ SYNC';btn.style.color='#8899bb';}
    if(status){status.textContent='✓ Synced';setTimeout(()=>{if(status)status.textContent='S5 DRAFT PENDING';},2000);}
    rPlayers();rGames();
    toast('Synced ✓');
  }).catch(()=>{
    if(btn){btn.textContent='↺ SYNC';btn.style.color='#E8192C';}
    toast('Sync failed','#E8192C');
  });
}

window.onload=()=>{setTimeout(()=>{
  document.getElementById('splash').classList.add('hide');
  document.getElementById('app').classList.add('visible');
  // Init clkSecs for any live games already in state
  S.games.filter(g=>g.status==='live').forEach(g=>{
    if(!g.clkSecs)g.clkSecs=clkToSecs(g.clk)||halfDefaultSecs(g.half);
  });
  startClockEngine();
  

// Ensure YouTube link always exists (migration for existing users)
  if(!S.news) S.news={};
  if(!S.news.social) S.news.social={};
  if(!S.news.social.yt) S.news.social.yt={};
  if(!S.news.social.yt.link) {
    S.news.social.yt.link='https://www.youtube.com/@HNGVRBALL';
    S.news.social.yt.blurb='Subscribe to our channel for full game replays and the Hangtime podcast. Every drop, every discussion. 🎥🎙️';
    save();
  }
  // Stats recalculation migration - refresh all player stats from corrected P0 data
  // If teams don't have all 7 S5 teams, reset to seed
if(!S.teams||S.teams.length<7){
  S.teams=JSON.parse(JSON.stringify(S5_TEAMS_SEED));
  save();
  setTimeout(()=>{fbPushTeams();fbPushPlayers();},2000);
}
if(S._statsVer!==6){
    // Full resync from P0 — updates name, active status, seasons, playoffs for every player
    P0.forEach(seed=>{
      const p=S.players.find(x=>x.id===seed.id);
      if(p){
        p.name=seed.name;
        p.active=seed.active;
        p.seasons=JSON.parse(JSON.stringify(seed.seasons));
        p.playoffs=JSON.parse(JSON.stringify(seed.playoffs));
      } else {
        // Add missing players
        S.players.push(JSON.parse(JSON.stringify(seed)));
      }
    });
    // Force correct teams
    S.teams=JSON.parse(JSON.stringify(S5_TEAMS_SEED));
    S._statsVer=6;
    save();
    setTimeout(()=>{fbPushPlayers();fbPushTeams();},1000);
  }
    fbInit();
  // Phase 1: restore the last-active tab (defaults to Home if none saved)
  const lastTab = (function(){ try { return localStorage.getItem('hngvr_lastTab'); } catch(e){ return null; } })();
  if(lastTab && ['home','games','players','hof','manage'].includes(lastTab) && lastTab !== 'home'){
    // Find the matching nav button and trigger its click handler
    const navBtns = document.querySelectorAll('.bnav .nb');
    const navOrder = ['home','games','players','hof','manage'];
    const idx = navOrder.indexOf(lastTab);
    if(idx >= 0 && navBtns[idx]){
      goPage(lastTab, navBtns[idx]);
    } else {
      rHomePage();
    }
  } else {
    rHomePage();
  }
  // Service worker registration (Phase 1 — offline cache + installable PWA)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('SW registered:', reg.scope);
    }).catch(err => console.warn('SW register failed', err));
  }
  // Viewer mode setup — show admin controls only when a PIN is unlocked.
  applyViewerMode();
},1500);};

// === Viewer / Admin Mode ===
// Phase 1: anyone landing on the site is in viewer mode (read-only).
// Entering a PIN in the Manage tab unlocks edit controls live (no reload).
// We attach a CSS class to <body> based on lock state; CSS in /style hides
// admin-only elements when in viewer mode.
function applyViewerMode(){
  const anyUnlocked = !!(typeof ownerUnlocked !== 'undefined' && ownerUnlocked) ||
                      !!(typeof pinUnlocked !== 'undefined' && pinUnlocked) ||
                      !!(typeof analystUnlocked !== 'undefined' && analystUnlocked);
  document.body.classList.toggle('viewer-mode', !anyUnlocked);
  document.body.classList.toggle('admin-mode', anyUnlocked);
}
// Hook into the existing PIN unlock functions: poll every 500ms during the first
// 30 seconds to catch unlocks. Simple, works without rewiring the manage UI.
setInterval(applyViewerMode, 500);
</script>
